name: Build APK y AAB Android 16 API 36

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$GITHUB_WORKSPACE/app/build.gradle" ] && [ -f "$GITHUB_WORKSPACE/settings.gradle" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            rm -rf "$GITHUB_WORKSPACE/project"
            mkdir -p "$GITHUB_WORKSPACE/project"

            ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f \
              \( -name 'geo-zeta-pdf-audio-apk-v*.zip' -o -name 'geo-zeta-pdf-audio-v*.zip' \) \
              -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)

            if [ -z "${ZIP_FILE:-}" ]; then
              echo "No se encontro el proyecto Android ni un ZIP de Geo Zeta."
              exit 1
            fi

            echo "Using ZIP: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/project"

            if [ -f "$GITHUB_WORKSPACE/project/app/build.gradle" ] && [ -f "$GITHUB_WORKSPACE/project/settings.gradle" ]; then
              PROJECT_DIR="$GITHUB_WORKSPACE/project"
            else
              SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/project" -maxdepth 3 -type f -name settings.gradle | head -n 1)

              if [ -z "${SETTINGS_FILE:-}" ]; then
                echo "El ZIP no contiene un proyecto Gradle valido."
                exit 1
              fi

              PROJECT_DIR=$(dirname "$SETTINGS_FILE")
            fi
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoZeta-PDF-a-Audio-API36-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Decode keystore
        shell: bash
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$PROJECT_DIR/upload-keystore.p12"

      - name: Create keystore.properties
        shell: bash
        run: |
          {
            echo "storeFile=$PROJECT_DIR/upload-keystore.p12"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEYSTORE_ALIAS }}"
            echo "keyPassword=${{ secrets.KEYSTORE_PASSWORD }}"
          } > "$PROJECT_DIR/keystore.properties"

      - name: Build Release AAB
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle bundleRelease --stacktrace --no-daemon

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: GeoZeta-PDF-a-Audio-AAB-release
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Clean up keystore
        if: always()
        shell: bash
        run: rm -f "$PROJECT_DIR/upload-keystore.p12" "$PROJECT_DIR/keystore.properties"
