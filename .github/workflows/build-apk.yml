name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Unzip project
        run: |
          mkdir project
          ZIP_FILE=$(ls geo-zeta-pdf-audio-apk-v*.zip | sort -V | tail -n 1)
          echo "Using $ZIP_FILE"
          unzip "$ZIP_FILE" -d project

      - name: Download PDF.js for offline APK
        run: |
          curl -L -o project/app/src/main/assets/pdf.min.js https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js
          curl -L -o project/app/src/main/assets/pdf.worker.min.js https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js

      - name: Download Gradle
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle.zip

      - name: Build APK
        run: |
          cd project
          ../gradle-8.10.2/bin/gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoZeta-PDF-a-Audio-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
