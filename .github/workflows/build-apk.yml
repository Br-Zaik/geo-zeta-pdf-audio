name: Build APK from any ZIP

on:
  push:
    paths:
      - '**/*.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Find ZIP automatically
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(git diff-tree --no-commit-id --name-only -r --root "$GITHUB_SHA" \
            | grep -Ei '\.zip$' \
            | head -n 1 || true)"

          if [ -z "$ZIP" ]; then
            ZIP="$(
              git ls-files \
              | grep -Ei '\.zip$' \
              | while IFS= read -r f; do
                  printf '%s\t%s\n' "$(git log -1 --format=%ct -- "$f")" "$f"
                done \
              | sort -nr \
              | head -n 1 \
              | cut -f2-
            )"
          fi

          if [ -z "${ZIP:-}" ] || [ ! -f "$ZIP" ]; then
            echo "::error::No se encontró ningún archivo ZIP en el repositorio."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Unzip project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf project
          mkdir -p project

          unzip -q "${{ steps.zip.outputs.zip }}" -d project

          echo "ZIP extraído correctamente."

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$(find project -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::El ZIP no contiene settings.gradle ni settings.gradle.kts."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "Proyecto Android encontrado en:"
          echo "$PROJECT_DIR"

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Versión del proyecto:"
          grep -R -E "versionCode|versionName" \
            "$PROJECT_DIR/app/build.gradle" \
            "$PROJECT_DIR/app/build.gradle.kts" 2>/dev/null || true

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.dir }}"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "${{ steps.project.outputs.dir }}" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "::error::La compilación terminó pero no se encontró el APK."
            exit 1
          fi

          mkdir -p output

          cp "$APK" output/Geo-Zeta-debug.apk

          echo "APK generado:"
          ls -lh output/Geo-Zeta-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Geo-Zeta-APK
          path: output/Geo-Zeta-debug.apk
          if-no-files-found: error
